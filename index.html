<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เครื่องคิดเลขหนีได้</title>
<style>
:root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#23201b;--mute:#8a8274;--btn:#e9e3d5;--op:#d9822b;--opink:#fff;--eq:#2f7d5b;--ring:#d9822b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--panel:#1e1b16;--ink:#f1ece0;--mute:#8d8576;--btn:#2d2920;--op:#e09040;--opink:#1a1306;--eq:#49b389;--ring:#e09040}}
:root[data-theme="dark"]{--bg:#15130f;--panel:#1e1b16;--ink:#f1ece0;--mute:#8d8576;--btn:#2d2920;--op:#e09040;--opink:#1a1306;--eq:#49b389;--ring:#e09040}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:12px;overflow-x:hidden}
#app{width:min(380px,100%);display:flex;flex-direction:column;gap:10px}
#disp{background:var(--panel);border-radius:18px;padding:14px 18px;text-align:right;min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#expr{color:var(--mute);font-size:16px;min-height:22px;word-break:break-all}
#main{font-size:42px;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all;line-height:1.15}
#area{position:relative;width:100%;height:min(560px,calc(100vh - 150px));min-height:420px;background:var(--panel);border-radius:18px;overflow:hidden;touch-action:manipulation}
.k,.r{position:absolute;left:0;top:0;border-radius:50%}
.k{border:0;background:var(--btn);color:var(--ink);font:600 22px system-ui,sans-serif;cursor:pointer;transition:transform 4.5s cubic-bezier(.45,.05,.4,1);will-change:transform;z-index:2;-webkit-tap-highlight-color:transparent}
.k.op{background:var(--op);color:var(--opink)}
.k.eq{background:var(--eq);color:#fff}
.k:active{filter:brightness(.9)}
.r{border:2px dashed var(--ring);opacity:.55;pointer-events:none;z-index:1}
</style>
</head>
<body>
<div id="app">
  <div id="disp"><div id="expr"></div><div id="main">0</div></div>
  <div id="area"></div>
</div>
<script>
(function(){
// ---------- exact rational arithmetic ----------
function gcd(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b){var t=a%b;a=b;b=t}return a}
function F(n,d){if(d===undefined)d=1n;if(d<0n){n=-n;d=-d}var g=gcd(n,d)||1n;return{n:n/g,d:d/g}}
function add(a,b){return F(a.n*b.d+b.n*a.d,a.d*b.d)}
function sub(a,b){return F(a.n*b.d-b.n*a.d,a.d*b.d)}
function mul(a,b){return F(a.n*b.n,a.d*b.d)}
function div(a,b){if(b.n===0n)throw new Error('div0');return F(a.n*b.d,a.d*b.n)}
function parse(s){
  var neg=s[0]==='-';if(neg)s=s.slice(1);
  var p=s.split('.'),ip=p[0]||'0',fp=p[1]||'';
  var n=BigInt(ip+fp);if(neg)n=-n;
  return F(n,BigInt('1'+'0'.repeat(fp.length)));
}
function fmt(f){
  var neg=f.n<0n,n=neg?-f.n:f.n,d=f.d,twos=0,fives=0,dd=d;
  while(dd%2n===0n){dd/=2n;twos++}
  while(dd%5n===0n){dd/=5n;fives++}
  var k=dd===1n?Math.max(twos,fives):12;
  var sc=10n**BigInt(k);
  var v=(n*sc*2n+d)/(2n*d);
  var s=v.toString();
  if(k>0){while(s.length<=k)s='0'+s;var ip=s.slice(0,s.length-k),fp=s.slice(s.length-k).replace(/0+$/,'');s=fp?ip+'.'+fp:ip}
  if(neg&&/[1-9]/.test(s))s='-'+s;
  return s;
}
// ---------- calculator state ----------
var tokens=[],entry='',ans=null,err=false;
var SYM={'/':'÷','*':'×','-':'−','+':'+'};
function evalTokens(t){
  var a=[t[0]],i;
  for(i=1;i<t.length;i+=2){
    var op=t[i],r=t[i+1];
    if(op==='*')a[a.length-1]=mul(a[a.length-1],r);
    else if(op==='/')a[a.length-1]=div(a[a.length-1],r);
    else{a.push(op);a.push(r)}
  }
  var res=a[0];
  for(i=1;i<a.length;i+=2)res=a[i]==='+'?add(res,a[i+1]):sub(res,a[i+1]);
  return res;
}
function render(){
  var m=document.getElementById('main'),e=document.getElementById('expr');
  var ex=tokens.map(function(x){return typeof x==='string'?SYM[x]:fmt(x)}).join(' ');
  e.textContent=ex;
  if(err)m.textContent='Error';
  else if(ans)m.textContent=fmt(ans);
  else m.textContent=entry===''?'0':entry;
  var fs=m.textContent.length>14?24:m.textContent.length>9?32:42;
  m.style.fontSize=fs+'px';
}
function reset(){tokens=[];entry='';ans=null;err=false}
function press(k){
  if(err&&k!=='C'){reset()}
  if(/^[0-9]$/.test(k)){
    if(ans){reset()}
    if(entry==='0')entry=k;else if(entry==='-0')entry='-'+k;else if(entry.replace(/[-.]/g,'').length<40)entry+=k;
  }else if(k==='.'){
    if(ans)reset();
    if(entry.indexOf('.')<0)entry=(entry===''||entry==='-')?entry+'0.':entry+'.';
  }else if(k==='C'){reset()}
  else if(k==='B'){
    if(ans){}else entry=entry.slice(0,-1);
    if(entry==='-')entry='';
  }else if(k==='N'){
    if(ans){ans=F(-ans.n,ans.d)}
    else entry=entry[0]==='-'?entry.slice(1):'-'+(entry===''?'0':entry);
  }else if(k==='%'){
    var base=ans?ans:(entry===''?null:parse(entry));
    if(base){
      var r=div(base,F(100n));
      if(ans)ans=r;else entry=fmt(r);
    }
  }else if('+-*/'.indexOf(k)>=0){
    if(ans){tokens=[ans];ans=null;entry=''}
    if(entry!==''&&entry!=='-'){tokens.push(parse(entry));tokens.push(k);entry=''}
    else if(tokens.length&&typeof tokens[tokens.length-1]==='string')tokens[tokens.length-1]=k;
    else if(!tokens.length){tokens.push(F(0n));tokens.push(k)}
  }else if(k==='='){
    if(ans){}
    else{
      var t=tokens.slice();
      if(entry!==''&&entry!=='-')t.push(parse(entry));
      else if(t.length&&typeof t[t.length-1]==='string')t.pop();
      if(t.length){
        try{ans=evalTokens(t);tokens=[];entry=''}catch(x){err=true;tokens=[];entry='';ans=null}
      }
    }
  }
  render();
}
// ---------- fleeing buttons ----------
var area=document.getElementById('area');
var LABELS=[['C','C'],['B','⌫'],['%','%'],['/','÷'],
['7','7'],['8','8'],['9','9'],['*','×'],
['4','4'],['5','5'],['6','6'],['-','−'],
['1','1'],['2','2'],['3','3'],['+','+'],
['N','±'],['0','0'],['.','.'],['=','=']];
var btns=[],S=62;
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function place(b,x,y){b.x=x;b.y=y;b.el.style.transform='translate('+x+'px,'+y+'px)'}
function layout(){
  var W=area.clientWidth,H=area.clientHeight;
  S=Math.round(clamp(W/5.2,48,70));
  var gx=(W-S*4)/5,gy=Math.min(gx,(H-S*5)/6);
  var top=(H-(S*5+gy*4))/2;
  btns.forEach(function(b,i){
    b.el.style.width=b.el.style.height=S+'px';
    b.el.style.transition='none';
    place(b,gx+(i%4)*(S+gx),top+Math.floor(i/4)*(S+gy));
    void b.el.offsetWidth;
    b.el.style.transition='';
  });
  document.querySelectorAll('.r').forEach(function(r){r.remove()});
}
function flee(b){
  var W=area.clientWidth,H=area.clientHeight,tx,ty,tries=0;
  do{tx=rnd(0,W-S);ty=rnd(0,H-S);tries++}
  while(Math.hypot(tx-b.x,ty-b.y)<130&&tries<40);
  var ax,ay;tries=0;
  do{
    var a=rnd(0,Math.PI*2),r=rnd(70,115);
    ax=clamp(tx+Math.cos(a)*r,0,W-S);ay=clamp(ty+Math.sin(a)*r,0,H-S);tries++;
  }while(Math.hypot(ax-tx,ay-ty)<60&&tries<40);
  if(b.ring)b.ring.remove();
  var ring=document.createElement('div');ring.className='r';
  ring.style.width=ring.style.height=S+'px';
  ring.style.transform='translate('+tx+'px,'+ty+'px)';
  area.appendChild(ring);b.ring=ring;
  var token=b.token=(b.token||0)+1;
  setTimeout(function(){if(b.token===token&&b.ring){b.ring.remove();b.ring=null}},4700);
  place(b,ax,ay);
}
LABELS.forEach(function(l){
  var el=document.createElement('button');
  el.className='k'+('+-*/'.indexOf(l[0])>=0?' op':'')+(l[0]==='='?' eq':'');
  el.textContent=l[1];
  var b={el:el,key:l[0],x:0,y:0};
  el.addEventListener('click',function(){press(b.key);flee(b)});
  area.appendChild(el);btns.push(b);
});
layout();
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(layout,150)});
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(/^[0-9.]$/.test(k)||'+-*/%'.indexOf(k)>=0)press(k);
  else if(k==='Enter'||k==='=')press('=');
  else if(k==='Backspace')press('B');
  else if(k==='Escape')press('C');
});
render();
})();
</script>
</body>
</html>
